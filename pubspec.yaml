name: folio
description: A distraction-free EPUB ebook reader for Android and Linux.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter

  # ── EPUB rendering ──────────────────────────────────────────────────────────
  # Pure Flutter widgets (no WebView), works on Android AND Linux
  # HTML rendering for EPUB content (used by epub_view, we use it directly for custom styling)
  flutter_html: ^3.0.0

  # Hyphenation support for justified text
  hyphenatorx: ^1.5.11

  # Low-level epub parser used for metadata extraction (cover, title, author)
  # epub_view already depends on this; we declare it explicitly so we can use it
  # ── File / folder picking ───────────────────────────────────────────────────
  # Supports Android (SAF) and Linux (GTK file chooser / XDG portal)
  file_picker: ^10.3.10

  # ── State management ────────────────────────────────────────────────────────
  flutter_riverpod: ^3.3.1

  # ── Persistence ─────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.5

  # ── Fonts ───────────────────────────────────────────────────────────────────
  google_fonts: ^8.0.2

  # ── Path utilities ──────────────────────────────────────────────────────────
  path: ^1.9.1
  path_provider: ^2.1.5

  # ── Android runtime permissions ─────────────────────────────────────────────
  # Handles READ_EXTERNAL_STORAGE (Android < 13) and media permissions (≥ 13)
  permission_handler: ^12.0.1
  archive: ^4.0.0
  xml: ^6.6.1
  # Pinned: flutter_html 3.0.0 uses `qs.matches`, removed in html 0.15.7.
  html: 0.15.6
  crypto: ^3.0.8
  image: ^4.0.0
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/reader/reader.css
    - assets/reader/reader.js
    - assets/reader/fonts/
